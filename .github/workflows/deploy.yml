name: Deploy TGDex-monorepo-microservices

on:
  push:
    branches:
      - Updated
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: sirpi/tgdex-monorepo-microservices
  CONTAINER_NAME: tgdex
jobs:
  deploy:
    runs-on: hetzner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vault CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault -y
          vault --version

      - name: Fetch secrets from Vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_URL }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          vault kv get -address="${VAULT_ADDR}" -field=monorepo-microservices-dev kv/projects/tgdex > .env
          
          if [ ! -f .env.production ]; then
            echo "Error: Failed to fetch secrets from Vault"
            exit 1
          fi
          
          echo "Secrets fetched successfully from Vault"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Docker Image
        run: |
          docker build --no-cache -t ${{ env.DOCKER_IMAGE_NAME }}:0-1-dev .
          docker push ${{ env.DOCKER_IMAGE_NAME }}:0-1-dev

      - name: Create project directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /root/tgdex-monorepo-microservices/temp

      - name: Copy .env file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env"
          target: "/root/tgdex-monorepo-microservices/temp/"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            echo "=== Logging in to Docker Hub ==="
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            echo "=== Pulling latest Docker image ==="
            docker pull ${{ env.DOCKER_IMAGE_NAME }}:0-1-dev
            
            echo "=== Stopping old container ==="
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            
            echo "=== Starting new container ==="
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              -p 8092:5000 \
              --env-file /root/tgdex-monorepo-microservices/temp/.env \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE_NAME }}:0-1-dev
            
            echo "=== Verifying deployment ==="
            sleep 5
            if docker ps | grep -q ${{ env.CONTAINER_NAME }}; then
              echo "Container is running"
              docker ps | grep ${{ env.CONTAINER_NAME }}
              echo ""
              echo "=== Recent Logs ==="
              docker logs --tail 20 ${{ env.CONTAINER_NAME }}
            else
              echo "Container failed to start"
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi
            
            echo ""
            echo "=== Deployment Complete ==="
            echo "API URL: http://tgdex-monorepo-microservices-dev-temp.sirpi.co.in"
            echo "Docs: http://tgdex-monorepo-microservices-dev-temp.sirpi.co.in/docs"
