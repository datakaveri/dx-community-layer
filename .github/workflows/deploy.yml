name: Deploy TGDex-monorepo-microservices

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: sirpi/tgdex-monorepo-microservices
  CONTAINER_NAME: tgdex-monorepo-microservices

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vault CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault -y
          vault --version

      - name: Fetch secrets from Vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_URL }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          vault kv get -address="${VAULT_ADDR}" -field=monorepo-microservices-dev kv/projects/tgdex > .env.production
          
          if [ ! -f .env.production ]; then
            echo "Error: Failed to fetch secrets from Vault"
            exit 1
          fi
          
          echo "Secrets fetched successfully from Vault"
      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Docker Image
        run: |
          docker build --no-cache -t ${{ secrets.DOCKER_IMAGE_NAME }}:dev .
          docker push ${{ secrets.DOCKER_IMAGE_NAME }}:dev

      - name: Copy .env file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env.production"
          target: "/tmp/tgdex-monorepo-microservices/"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            echo "=== Moving .env file to project directory ==="
            mkdir -p /root/tgdex-monorepo-microservices
            mv /tmp/tgdex-monorepo-microservices/.env.production /root/tgdex-monorepo-microservices/.env
            
            echo "=== Logging in to Docker Hub ==="
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            echo "=== Pulling latest Docker image ==="
            docker pull ${{ secrets.DOCKER_IMAGE_NAME }}:dev
            
            echo "=== Stopping old container ==="
            docker stop ${{ secrets.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ secrets.CONTAINER_NAME }} 2>/dev/null || true
            
            echo "=== Starting new container ==="
            docker run -d \
              --name ${{ secrets.CONTAINER_NAME }} \
              -p 8091:5000 \
              --env-file /root/tgdex-monorepo-microservices/.env \
              --restart always \
              ${{ secrets.DOCKER_IMAGE_NAME }}:dev
            
            echo "=== Cleaning up ==="
            rm -rf /tmp/tgdex-monorepo-microservices/
            
            echo "=== Verifying deployment ==="
            sleep 5
            if docker ps | grep -q ${{ secrets.CONTAINER_NAME }}; then
              echo "Container is running"
              docker ps | grep ${{ secrets.CONTAINER_NAME }}
              echo ""
              echo "=== Recent Logs ==="
              docker logs --tail 20 ${{ secrets.CONTAINER_NAME }}
            else
              echo "Container failed to start"
              docker logs ${{ secrets.CONTAINER_NAME }}
              exit 1
            fi
            
            echo ""
            echo "=== Deployment Complete ==="
            echo "API URL: http://tgdex-monorepo-microservices-dev.sirpi.co.in"
            echo "Docs: http://tgdex-monorepo-microservices-dev.sirpi.co.in/docs"
