---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgdex-monolith
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tgdex-monolith
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tgdex-monolith
    securityContext:
      fsGroup: 1000
      runAsNonRoot: true
      supplementalGroups: [1000]
    spec:
      imagePullSecrets:
        - name: <placeholder>
      containers:
        - name: tgdex-monolith
          image: <placeholder>
      ports:
        - containerPort: 5000
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          memory: "1Gi"
      envFrom:
        - secretRef:
            name: <placeholder>
      imagePullPolicy: Always
      lifecycle:
        preStop:
          exec:
            command: ["/bin/sh", "-c", "sleep 10"]
      readinessProbe:
        httpGet:
          path: /healthz
          port: 5000
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /healthz
          port: 5000
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      securitycontext:
        runasnonroot: true
        runasuser: 1000
        runasgroup: 1000
        readonlyrootfilesystem: true
        capabilities:
          drop:
            - all
