version: "3.8"

services:
  app:
    image: <place-holder>

    environment:
      INSTANCE: production
      BASE_URL: http://localhost:5000
      ACTIVATED_SERVICES: '["DISCUSSION", "CHALLENGE"]'

      # S3-compatible object store. Export these in the deploying shell;
      # leaving them unset selects AWS S3. S3_ENDPOINT_URL must be the
      # *service* endpoint, not a bucket URL -- boto3 adds the bucket itself,
      # per S3_ADDRESSING_STYLE. Example (staging):
      #   export S3_ENDPOINT_URL=https://pocrakkpc.s3.cyfuture.cloud
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # Leave these two empty unless a provider requires otherwise: empty means
      # boto3 keeps its own defaults (path addressing behind a custom endpoint,
      # SigV2 at us-east-1), which is what staging runs on today.
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}
      S3_SIGNATURE_VERSION: ${S3_SIGNATURE_VERSION:-}

    secrets:
      - postgres_user
      - postgres_password
      - postgres_host
      - discussion_db_name
      - challenge_db_name
      - discussion_db_schema
      - challenge_db_schema
      - redis_url
      - keycloak_url
      - keycloak_realm
      - keycloak_audience
      - keycloak_issuer
      - discussion_s3_bucket
      - challenge_s3_bucket
      - s3_access_key_id
      - s3_secret_access_key
      - s3_default_region

    configs:
      - source: app_entrypoint
        target: /home/devops/entrypoint.sh
        mode: 0755

    entrypoint: ["/bin/sh", "/home/devops/entrypoint.sh"]

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

    networks:
      - tgdex-network

networks:
  tgdex-network:
    external: true

# SECRETS (must already exist via docker secret create ...)
secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
  postgres_host:
    external: true
  discussion_db_name:
    external: true
  challenge_db_name:
    external: true
  discussion_db_schema:
    external: true
  challenge_db_schema:
    external: true
  redis_url:
    external: true
  keycloak_url:
    external: true
  keycloak_realm:
    external: true
  keycloak_audience:
    external: true
  keycloak_issuer:
    external: true
  discussion_s3_bucket:
    external: true
  challenge_s3_bucket:
    external: true
  s3_access_key_id:
    external: true
  s3_secret_access_key:
    external: true
  s3_default_region:
    external: true

configs:
  app_entrypoint:
    file: ./entrypoint.sh
